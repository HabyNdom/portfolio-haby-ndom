<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-labelledby="title desc">
  <title id="title">Plateforme Recrutement ESCOA</title>
  <desc id="desc">Système de gestion du recrutement universitaire et des professeurs</desc>
  <defs>
    <linearGradient id="escoaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2b48" />
      <stop offset="100%" stop-color="#1e3a5f" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e6654d" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
  </defs>
  <rect width="320" height="180" rx="16" fill="url(#escoaGrad)"/>
  
  <!-- Subtle background decorative grid -->
  <circle cx="280" cy="30" r="70" fill="rgba(255,255,255,0.03)" />
  <circle cx="40" cy="150" r="50" fill="rgba(230,101,77,0.08)" />

  <!-- Badge banner -->
  <rect x="24" y="22" width="105" height="24" rx="12" fill="rgba(255,255,255,0.12)" />
  <text x="76" y="38" fill="#e2e8f0" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" text-anchor="middle">PHP · MYSQL</text>

  <!-- Central card element -->
  <rect x="24" y="58" width="272" height="96" rx="10" fill="#ffffff" filter="drop-shadow(0 10px 15px rgba(0,0,0,0.25))" />
  
  <!-- University Icon / Graduation cap -->
  <g transform="translate(42, 74)">
    <circle cx="20" cy="20" r="20" fill="#f0fdf4" stroke="#10b981" stroke-width="1.5"/>
    <path d="M10 20 L20 14 L30 20 L20 25 Z" fill="#0f2b48"/>
    <path d="M14 22.5 V27 C14 29 26 29 26 27 V22.5" fill="none" stroke="#0f2b48" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M28 20.5 V26" stroke="#e6654d" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Title & tags inside card -->
  <text x="94" y="85" fill="#0f2b48" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="700">ESCOA RECRUTEMENT</text>
  <text x="94" y="103" fill="#64748b" font-family="'DM Sans', sans-serif" font-size="11" font-weight="500">Plateforme Professeurs &amp; Candidatures</text>
  
  <rect x="94" y="116" width="62" height="18" rx="4" fill="#ecfdf5"/>
  <text x="125" y="129" fill="#047857" font-family="'DM Sans', sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">Sécurisé CSRF</text>

  <rect x="162" y="116" width="68" height="18" rx="4" fill="#eff6ff"/>
  <text x="196" y="129" fill="#1d4ed8" font-family="'DM Sans', sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">Espace Admin</text>
</svg>
